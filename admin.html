<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel dos noivos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff8fa;--surface:#fff;--pink:#f8d7e0;--pink-soft:#fdecf1;--pink-deep:#c0577a;--gold:#b8913f;--gold-light:#e3c97f;--text:#4a3a40;--muted:#8a7279;--border:#f0d3dc;--ok:#2f8f5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f24;--surface:#35282e;--pink:#4a303a;--pink-soft:#3d2b33;--pink-deep:#f0a3bc;--gold:#e3c97f;--gold-light:#b8913f;--text:#f6e9ee;--muted:#c3a8b1;--border:#52383f;--ok:#6fcf97}}
:root[data-theme="dark"]{--bg:#2a1f24;--surface:#35282e;--pink:#4a303a;--pink-soft:#3d2b33;--pink-deep:#f0a3bc;--gold:#e3c97f;--gold-light:#b8913f;--text:#f6e9ee;--muted:#c3a8b1;--border:#52383f;--ok:#6fcf97}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:300 1rem/1.6 'Poppins',system-ui,sans-serif}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
h1{color:var(--pink-deep);font-size:2rem}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:18px}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
label{display:block;font-size:.85rem;font-weight:500;margin:12px 0 6px}
button{font:inherit;cursor:pointer;border-radius:999px;padding:10px 18px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem;font-weight:500}
button.primary{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#fff;border:0}
button:disabled{opacity:.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.stat{background:var(--pink-soft);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.stat small{display:block;color:var(--muted)}
.stat b{font:600 1.7rem 'Cormorant Garamond',serif;color:var(--pink-deep)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar select{width:auto}
.item{border-top:1px solid var(--border);padding:16px 0;display:grid;gap:8px}
.item:first-child{border-top:0}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.nome{font-weight:500}.valor{color:var(--gold);font-weight:500}
.msg{color:var(--muted);font-style:italic;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--pink-soft);border:1px solid var(--border)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.err{color:#d6455d;font-size:.85rem;min-height:1.2em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<!-- LOGIN -->
<section class="card" id="loginView" style="max-width:420px;margin:60px auto" hidden>
  <h1>Painel dos noivos</h1>
  <p style="color:var(--muted)">Acesso restrito.</p>
  <form id="loginForm">
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="primary" type="submit">Entrar</button>
  </form>
</section>

<!-- PAINEL -->
<div id="panelView" hidden>
  <div class="top"><h1>Painel dos noivos 💌</h1><button id="logoutBtn">Sair</button></div>

  <div class="stats">
    <div class="stat"><small>Total registrado</small><b id="sTotal">R$ 0,00</b></div>
    <div class="stat"><small>Pix conferido</small><b id="sConf">R$ 0,00</b></div>
    <div class="stat"><small>Pessoas</small><b id="sCount">0</b></div>
    <div class="stat"><small>Falta agradecer</small><b id="sPend">0</b></div>
  </div>

  <div class="card">
    <h2>Mensagem de agradecimento</h2>
    <label for="tpl">Use {nome} onde quiser o nome do convidado</label>
    <textarea id="tpl" rows="3"></textarea>
  </div>

  <div class="card">
    <div class="bar">
      <h2 style="margin-right:auto">Registros recebidos</h2>
      <select id="filtro" aria-label="Filtrar">
        <option value="todos">Todos</option>
        <option value="pend">Falta agradecer</option>
        <option value="nconf">Pix não conferido</option>
      </select>
      <button id="csvBtn">Baixar CSV</button>
      <button id="reloadBtn">Atualizar</button>
    </div>
    <p class="err" id="listErr" role="alert"></p>
    <div id="list"><p style="color:var(--muted)">Carregando…</p></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const $ = (s) => document.querySelector(s);
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtDate = (d) => new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
const TPL_KEY = 'cha-duda:tpl';
const DEFAULT_TPL = 'Oi, {nome}! Muito obrigada pela sua contribuição e pelo carinho. Sua presença e sua mensagem fizeram nosso chá ainda mais especial. ❤️';

let db, rows = [];

if (!CFG.SUPABASE_URL || !window.supabase) {
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Preencha o <b>config.js</b> com os dados do Supabase para usar o painel.</p>';
} else {
  try {
    db = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    init().catch(fatal);
  } catch (e) { fatal(e); }
}
function fatal(e) {
  console.error(e);
  document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;color:#b3261e"></p>';
  document.body.firstChild.textContent = 'Erro ao iniciar o painel: ' + (e && e.message ? e.message : e) +
    '. Confira o config.js (a URL deve ser https://SEU-ID.supabase.co e a chave deve estar na linha SUPABASE_ANON_KEY).';
}

async function init() {
  try { $('#tpl').value = localStorage.getItem(TPL_KEY) || DEFAULT_TPL; } catch (_) { $('#tpl').value = DEFAULT_TPL; }
  const { data } = await db.auth.getSession();
  data.session ? showPanel() : showLogin();
}
function showLogin() { $('#loginView').hidden = false; $('#panelView').hidden = true; }
async function showPanel() { $('#loginView').hidden = true; $('#panelView').hidden = false; await load(); }

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('#email').value, password: $('#senha').value });
  if (error) {
    console.error(error);
    const m = (error.message || '').toLowerCase();
    $('#loginErr').textContent =
      m.includes('invalid login') ? 'E-mail ou senha incorretos (ou usuário não existe neste projeto).' :
      m.includes('not confirmed') ? 'E-mail ainda não confirmado. No Supabase, confirme o usuário em Authentication > Users.' :
      m.includes('api key') || m.includes('jwt') ? 'Chave do Supabase recusada. Use a chave "anon" (Legacy API keys) no config.js.' :
      'Erro ao entrar: ' + error.message;
    return;
  }
  showPanel();
});
$('#logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); showLogin(); });
$('#reloadBtn').addEventListener('click', load);
$('#filtro').addEventListener('change', render);
$('#tpl').addEventListener('input', () => { try { localStorage.setItem(TPL_KEY, $('#tpl').value); } catch (_) {} });

async function load() {
  $('#listErr').textContent = '';
  const { data, error } = await db.from(CFG.TABLE || 'contribuicoes').select('*').order('created_at', { ascending: false });
  if (error) { $('#listErr').textContent = 'Não foi possível carregar os registros.'; return; }
  rows = data; render();
}

function render() {
  const sum = (arr) => arr.reduce((t, r) => t + Number(r.valor), 0);
  $('#sTotal').textContent = brl.format(sum(rows));
  $('#sConf').textContent = brl.format(sum(rows.filter((r) => r.confirmado)));
  $('#sCount').textContent = rows.length;
  $('#sPend').textContent = rows.filter((r) => !r.agradecido).length;

  const f = $('#filtro').value;
  const view = rows.filter((r) => f === 'pend' ? !r.agradecido : f === 'nconf' ? !r.confirmado : true);
  const list = $('#list');
  list.textContent = '';
  if (!view.length) { list.innerHTML = '<p style="color:var(--muted)">Nenhum registro por aqui.</p>'; return; }

  view.forEach((r) => {
    const el = document.createElement('article');
    el.className = 'item';
    // Todo texto vindo dos convidados entra via textContent (evita injeção de HTML)
    const head = document.createElement('div'); head.className = 'row';
    const nome = document.createElement('span'); nome.className = 'nome'; nome.textContent = r.nome;
    const valor = document.createElement('span'); valor.className = 'valor'; valor.textContent = brl.format(r.valor);
    head.append(nome, valor);

    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = fmtDate(r.created_at) + (r.whatsapp ? ' · WhatsApp ' + r.whatsapp : '');

    const tags = document.createElement('div'); tags.className = 'actions';
    tags.append(tag(r.confirmado ? 'Pix conferido' : 'Pix não conferido', r.confirmado),
                tag(r.agradecido ? 'Agradecido' : 'Falta agradecer', r.agradecido));

    const actions = document.createElement('div'); actions.className = 'actions';
    actions.append(
      btn(r.confirmado ? 'Desmarcar Pix' : 'Marcar Pix conferido', () => update(r.id, { confirmado: !r.confirmado })),
      btn(r.agradecido ? 'Desmarcar agradecido' : 'Marcar agradecido', () => update(r.id, { agradecido: !r.agradecido, agradecido_em: r.agradecido ? null : new Date().toISOString() })),
      btn('Agradecer 💌', () => thank(r), true)
    );

    el.append(head, meta);
    if (r.mensagem) { const m = document.createElement('div'); m.className = 'msg'; m.textContent = '“' + r.mensagem + '”'; el.append(m); }
    el.append(tags, actions);
    list.append(el);
  });
}
const tag = (t, ok) => { const s = document.createElement('span'); s.className = 'tag' + (ok ? ' ok' : ''); s.textContent = t; return s; };
const btn = (t, fn, primary) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (primary) b.className = 'primary'; b.addEventListener('click', fn); return b; };

async function update(id, patch) {
  const { error } = await db.from(CFG.TABLE || 'contribuicoes').update(patch).eq('id', id);
  if (error) { $('#listErr').textContent = 'Não foi possível atualizar.'; return; }
  await load();
}

async function thank(r) {
  const text = $('#tpl').value.replace(/\{nome\}/g, r.nome.split(' ')[0]);
  if (r.whatsapp) {
    const num = r.whatsapp.length <= 11 ? '55' + r.whatsapp : r.whatsapp; // assume Brasil se vier sem DDI
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  } else {
    try { await navigator.clipboard.writeText(text); alert('Sem WhatsApp cadastrado. Mensagem copiada, é só colar onde preferir.'); }
    catch (_) { prompt('Copie a mensagem:', text); }
  }
  if (!r.agradecido && confirm('Marcar ' + r.nome + ' como agradecido(a)?')) update(r.id, { agradecido: true, agradecido_em: new Date().toISOString() });
}

$('#csvBtn').addEventListener('click', () => {
  const esc = (v) => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const head = ['Nome', 'Valor', 'WhatsApp', 'Mensagem', 'Pix conferido', 'Agradecido', 'Data'];
  const lines = rows.map((r) => [r.nome, r.valor, r.whatsapp, r.mensagem, r.confirmado ? 'sim' : 'não', r.agradecido ? 'sim' : 'não', fmtDate(r.created_at)].map(esc).join(';'));
  const blob = new Blob(['\ufeff' + [head.map(esc).join(';'), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'contribuicoes.csv'; a.click(); URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
